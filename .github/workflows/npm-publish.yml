name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run all-tests
      - run: npm publish --provenance
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  create-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: Package documentation
        run: node scripts/archive-docs.ts "$RUNNER_TEMP/documentation.tar.gz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" "$RUNNER_TEMP/documentation.tar.gz" \
              --repo="$GITHUB_REPOSITORY" \
              --title="v${tag#v}" \
              --generate-notes

  deploy-docs:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
