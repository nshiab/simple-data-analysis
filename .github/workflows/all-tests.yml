name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  all-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@v2
      - run: deno task all-tests
